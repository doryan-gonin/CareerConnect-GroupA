[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas", email = "tom.laripo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.44",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
]

[tool.uv]
package = false

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Keep the initial lint policy focused on correctness and import hygiene. More
# opinionated rule families can be enabled incrementally as the backend evolves.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The seed script adds the src-layout directory before importing backend modules.
"utility/seedjobs.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
