[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas", email = "tom.laripo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.163.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.44,<0.0.45",
    "psycopg[binary]>=3.3.9",
    "httpx>=0.28.1",
    "pypdf>=7.1.0",
]

[tool.uv]
package = false

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
]
