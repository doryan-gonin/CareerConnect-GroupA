name: CI Pipeline

# Trigger the workflow on PR to <main>
on:
  pull_request:
    branches:
      - main

jobs:
  # Separating backend and frontend jobs allow parallel execution
  # ---------------------------------------------------------------------------
  # BACKEND -> Build, Lint, Test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3 # Auto-cache the environment
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      # Install dependencies
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # PyTest testing --> Auth, Profile, Resume
      - name: Run PyTest
        run: uv run pytest tests/ -v
        env:
          JWT_SECRET_KEY: "1f91d2f49e54c31f330db929c0a58e52" #This is at dummy test key, can be pushed safely

  # ---------------------------------------------------------------------------
  # FRONTEND -> Build and verify
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up pnpm before Node so setup-node can cache the pnpm store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      # Set up Node and cache pnpm dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./src/frontend/.node-version 
          cache: "pnpm"
          cache-dependency-path: ./src/frontend/pnpm-lock.yaml

      # Clean install of dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the frontend
      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build
