name: CI Pipeline

# Trigger the workflow on PR to <main>
on:
  pull_request:
    branches:
      - main

jobs:
  # Separating backend and frontend jobs allow parallel execution
  # ---------------------------------------------------------------------------
  # BACKEND -> Build, Lint, Test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3 # Auto-cache the environment
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      # Install dependencies
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # PyTest testing --> Auth, Profile, Resume
      - name: Run PyTest
        run: uv run pytest tests/ -v
        env:
          JWT_SECRET_KEY: "1f91d2f49e54c31f330db929c0a58e52" #This is at dummy test key, can be pushed safely

  # ---------------------------------------------------------------------------
  # FRONTEND -> Build and verify
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The Playwright web server starts the real FastAPI app with uv.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install backend dependencies for E2E
        run: uv sync --all-extras --dev
        working-directory: .

      # Set up Node and cache npm dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./src/frontend/.node-version 
          cache: "npm"
          cache-dependency-path: ./src/frontend/package-lock.json

      # Clean install of dependencies
      - name: Install dependencies
        run: npm ci # Follows the lockfile (compared to npm install)

      # Build the frontend
      - name: Build frontend
        run: npm run build

      # Install the browser used by the deterministic Playwright suite
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Run browser-level frontend tests against the disposable E2E backend
      - name: Run Playwright E2E tests
        run: npm run e2e
