name: CI Pipeline

# Trigger the workflow on PR to <main>
on:
  pull_request:
    branches:
      - main

jobs:
  # Separating backend and frontend jobs allow parallel execution
  # ---------------------------------------------------------------------------
  # BACKEND -> Build, Lint, Test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3 # Auto-cache the environment
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      # Install dependencies
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # PyTest testing --> Auth, Profile, Resume
      - name: Run PyTest
        run: uv run pytest tests/ -v
        env:
          JWT_SECRET_KEY: "1f91d2f49e54c31f330db929c0a58e52" #This is at dummy test key, can be pushed safely

  # ---------------------------------------------------------------------------
  # FRONTEND -> Build and verify
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up the Node runtime required by Vite+.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./src/frontend/.node-version 
          cache: "npm"
          cache-dependency-path: ./src/frontend/package-lock.json

      # Bootstrap the pinned Vite+ CLI before installing project dependencies.
      # Vite+ then delegates installation to the package manager selected by
      # package-lock.json and provides all frontend build checks.
      - name: Install Vite+
        run: npm install --global vite-plus@1.6.0

      # Clean install of dependencies from the npm lockfile.
      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Run the unified Vite+ checks.
      - name: Lint frontend
        run: vp lint

      - name: Check frontend formatting
        run: vp fmt --check

      - name: Run frontend unit tests
        run: vp test --run --passWithNoTests

      # Playwright remains a separate browser runner. Run it through vp exec
      # when a checkout supplies a Playwright config and dependency.
      - name: Run Playwright E2E tests
        if: ${{ hashFiles('src/frontend/playwright.config.*') != '' }}
        run: |
          vp exec playwright install --with-deps chromium
          vp exec playwright test

      # Build the frontend
      - name: Build frontend
        run: vp build
