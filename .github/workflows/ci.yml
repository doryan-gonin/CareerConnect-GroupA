name: CI Pipeline

# Trigger the workflow on PR to <main>
on:
  pull_request:
    branches:
      - main

jobs:
  # Separating backend and frontend jobs allow parallel execution
  # ---------------------------------------------------------------------------
  # BACKEND -> Build, Lint (TODO: Test)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3 # Auto-cache the environment
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      # Install dependencies
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # PyTest testing
      - name: Run PyTest
        run: uv run pytest tests/ -v
        env:
          JWT_SECRET_KEY: "test_secret_key"

  # ---------------------------------------------------------------------------
  # FRONTEND -> Build and verify
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Node and cache npm dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./src/frontend/.node-version 
          cache: "npm"
          cache-dependency-path: ./src/frontend/package-lock.json

      # Clean install of dependencies
      - name: Install dependencies
        run: npm ci # Follows the lockfile (compared to npm install)

      # Build the frontend
      - name: Build frontend
        run: npm run build
